<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAIG 2027 — Logistics Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c2340">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--panel:#fff;--panel2:#f8f5ee;--line:#e3ddd0;--ink:#0c2340;--mute:#5c6470;--gold:#c79a3b;--navy:#0c2340;
--good:#13795b;--goodbg:#e3f3ec;--warn:#9a5b00;--warnbg:#fbefd9;--bad:#b3261e;--badbg:#fbe7e5;--info:#2457a6;--infobg:#e6eefb;--shadow:0 1px 2px rgba(12,35,64,.05),0 6px 18px rgba(12,35,64,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--panel:#17202e;--panel2:#1d2838;--line:#2a3546;--ink:#e9edf3;--mute:#a3adbb;--good:#4cc79a;--goodbg:#13342a;--warn:#e7b45a;--warnbg:#3a2c12;--bad:#ff8a80;--badbg:#3d1c1b;--info:#8fb4ff;--infobg:#1b2a45;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1622;--panel:#17202e;--panel2:#1d2838;--line:#2a3546;--ink:#e9edf3;--mute:#a3adbb;--good:#4cc79a;--goodbg:#13342a;--warn:#e7b45a;--warnbg:#3a2c12;--bad:#ff8a80;--badbg:#3d1c1b;--info:#8fb4ff;--infobg:#1b2a45;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Lato",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;text-wrap:balance}
a{color:var(--info)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--navy);color:#e9edf3;padding:18px 12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 6px}
.mk{width:38px;height:38px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:700 15px Georgia,serif;flex:none}
.brand b{display:block;font:700 16px Georgia,serif}.brand small{color:#a9b6c9;font-size:11px}
#nav{display:flex;flex-direction:column;gap:1px}
#nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8d9cb3;padding:12px 10px 4px}
#nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#e9edf3;text-decoration:none;cursor:pointer;font-size:14px}
#nav a:hover{background:rgba(255,255,255,.07)}
#nav a.on{background:rgba(199,154,59,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold);font-weight:600}
#nav .bd{font-size:11px;min-width:20px;text-align:center;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.12);font-weight:600}
#nav .bd.bad{background:#b3261e;color:#fff}#nav .bd.warn{background:#b07a1a;color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:#a9b6c9;padding:0 6px}
.side-foot button{background:rgba(255,255,255,.08);border:0;color:#e9edf3;border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left}
.hc{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55}
.hc b{color:#fff;font-size:15px;font-family:Georgia,serif}.hc span{color:#a9b6c9}
.main{min-width:0;padding:0 28px 56px}
.top{display:flex;align-items:flex-end;gap:14px;justify-content:space-between;padding:22px 0 14px;flex-wrap:wrap}
.top h1{font-size:25px}.sub{margin:3px 0 0;color:var(--mute);font-size:14px}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.menu{display:none}
.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card>h2{font-size:17px;margin-bottom:4px}.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);text-align:left}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--gold)}
.kpi span{display:block;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font:700 27px/1.15 Georgia,serif;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mute);font-size:12px}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--good)}
.pill{display:inline-block;white-space:nowrap;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.pill.good{background:var(--goodbg);color:var(--good);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.pill.info{background:var(--infobg);color:var(--info);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{background:var(--gold);border-color:var(--gold);color:#0c2340}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--gold);border-color:var(--gold);color:#0c2340}}
.btn.sm{padding:3px 10px;font-size:13px}.btn.ghost{background:transparent}.btn.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
/* filter bar */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbar input[type=search]{flex:1 1 220px;width:auto;min-width:180px}
.fbar select{width:auto}
.fx{position:relative}
.fx>summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:var(--panel);white-space:nowrap;font-size:14px}
.fx>summary::-webkit-details-marker{display:none}
.fx>summary:after{content:" ▾";color:var(--mute)}
.fx.act>summary{border-color:var(--gold);background:var(--warnbg);color:var(--ink);font-weight:600}
.fxm{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:230px;max-width:320px;max-height:330px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px}
.fxm label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.fxm label:hover{background:var(--panel2)}.fxm input{width:auto}.fxm em{margin-left:auto;color:var(--mute);font-style:normal;font-size:12px}
.fxm .fxa{display:flex;gap:6px;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip button{border:0;background:none;cursor:pointer;color:var(--mute);padding:0;font-size:14px;line-height:1}
.fcount{color:var(--mute);font-size:13px;margin-left:auto;white-space:nowrap}
.fmob{display:none}
@media (max-width:900px){.fmob{display:inline-flex}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{background:var(--gold);color:#0c2340}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}.chk input{width:auto}
/* lists */
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:1fr auto;gap:3px 14px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}.it:hover{background:var(--panel2)}
.it .t{font-weight:600;min-width:0}.it .m{color:var(--mute);font-size:13px;grid-column:1/2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.it .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--mute);white-space:nowrap}
.grp-h{display:flex;align-items:center;gap:8px;margin:16px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700}
.grp-h:first-child{margin-top:0}
details.al{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0}
details.al.bad{border-left-color:var(--bad)}details.al.warn{border-left-color:var(--warn)}details.al.info{border-left-color:var(--info)}
details.al>summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;gap:10px;align-items:center}
details.al>summary::-webkit-details-marker{display:none}
details.al>summary b{flex:1}details.al>summary:after{content:"Show";color:var(--info);font-size:12px}
details.al[open]>summary:after{content:"Hide"}details.al[open]>summary{border-bottom:1px solid var(--line)}
details.al .list,details.al .pad{padding:0 12px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--gold)}
.prog{display:grid;grid-template-columns:minmax(120px,200px) 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.prog small{color:var(--mute);text-align:right}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel2)}
tr.tot td{font-weight:700;background:var(--panel2)}
td.ed{cursor:pointer}td.ed:hover{background:var(--panel2)}
td small,.sm{color:var(--mute);font-size:12px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.vc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.vc:hover{border-color:var(--gold)}.vc h3{font-size:16px}.vc .kv{font-size:13px;color:var(--mute)}.vc .kv b{color:var(--ink);font-weight:600}
.split{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:4px}
.split div{background:var(--panel2);border-radius:8px;padding:5px 6px;text-align:center}
.split b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.split span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.vc .split{grid-template-columns:repeat(3,minmax(0,1fr))}
.split div.t{background:var(--navy);color:#fff}.split div.t span{color:#c9d3e2}
.empty{color:var(--mute);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.note{padding:10px 14px;border-radius:10px;background:var(--panel2);color:var(--mute);font-size:13px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.drawer-bg{position:fixed;inset:0;background:rgba(8,16,28,.45);z-index:2000;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);z-index:2001;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{font-size:19px;flex:1}.db{padding:4px 20px 20px;overflow:auto;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.notes{white-space:pre-wrap;font-size:13.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:340px;overflow:auto}
.kvt{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin-top:10px}.kvt dt{color:var(--mute);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}.kvt dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fg td{text-align:center}.fg td:first-child{text-align:left}
.fgc{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);min-width:96px}
.fgc.on{background:var(--goodbg);border-color:transparent}
.fgc .who{display:flex;gap:3px}.fgc .who button{border:1px solid var(--line);background:var(--panel);border-radius:5px;font-size:10.5px;padding:0 5px;cursor:pointer}
.fgc .who button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pin input{width:140px;letter-spacing:.3em;text-align:center}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed var(--line)}.tree>ul{padding-left:0;border:0}
.tree li{margin:3px 0}.tn{display:inline-flex;gap:8px;align-items:center;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.tn:hover{border-color:var(--gold)}.tn small{color:var(--mute)}.tn{flex-direction:column;align-items:flex-start;gap:2px}.tn .tl{display:inline-flex;gap:8px;align-items:center}.tn .td{font-size:11px;color:var(--mute);line-height:1.35}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60;padding:16px}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 26px;max-width:400px;width:100%;text-align:center}
.gate .mk{margin:0 auto 12px;width:48px;height:48px;font-size:18px}
.gate h1{font-size:22px;margin-bottom:6px}.gate p{color:var(--mute);margin:0 0 18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}
.ro .edonly{display:none!important}
.preview{background:var(--gold);color:var(--navy);font-size:12px;font-weight:700;text-align:center;padding:5px 10px}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:2002;transform:translateX(-100%);transition:.2s;height:100%}
 .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
 .btn.menu{display:inline-flex}.main{padding:0 14px 48px}
 .g2{grid-template-columns:1fr}.prog{grid-template-columns:1fr 70px}.prog .bar{grid-column:1/-1;order:3}
 .it{grid-template-columns:1fr}.it .r{grid-row:auto;grid-column:1;flex-direction:row;align-items:center}
 .split{grid-template-columns:repeat(3,minmax(0,1fr))}.kvt{grid-template-columns:1fr}
 .fxm{position:fixed;left:12px;right:12px;top:auto;max-width:none}
 .fcount{margin-left:0;width:100%}
 .fwrap:not(.fopen) .fbar > :not([data-fq]):not(.fmob):not(.fcount){display:none}
 .fbar input[type=search]{min-width:0;flex:1 1 150px}
}
@media print{.side,.top-r,.menu,.fbar{display:none!important}.shell{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── calm pass: fewer borders, one status per row, roomier ── */
:root{--line:#e8e2d6;--shadow:none}
.card{border-radius:14px;padding:20px 22px}
.card>h2,.ch{font:600 15px/1.3 "Lato",system-ui,sans-serif;letter-spacing:.01em;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.ch .sp{margin-left:auto}.hint{font-size:12.5px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{border-radius:14px;padding:14px 16px}.kpi span{font-size:11px}.kpi b{font-size:30px}
.view{gap:18px}
.it{padding:10px 2px;gap:2px 16px;align-items:center}
.it .t{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.it .m{font-size:12.5px}
.it .r{grid-row:1/3;flex-direction:row;align-items:center;gap:10px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--mute);transform:translateY(-1px)}
.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}
.due{font-variant-numeric:tabular-nums;white-space:nowrap}.due.late{color:var(--bad);font-weight:600}
/* filter bar */
.fwrap{background:transparent;border:0;padding:0}
.fbar{gap:8px}
.fbar input[type=search]{background:var(--panel);border-radius:10px;padding:9px 12px;flex:1 1 260px}
.fx>summary{border-radius:10px;padding:8px 13px;font-size:14px}
.fx>summary:after{content:""}
.fxm.wide{width:min(760px,calc(100vw - 32px));max-width:none;max-height:none;padding:14px}
.fxm.nar{min-width:240px;padding:12px}.fxm.right{left:auto;right:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fsh{display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:4px}
.fsl{max-height:210px;overflow:auto}
.fsl label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.fsl label:hover{background:var(--panel2)}.fsl input{width:auto}.fsl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fsl em{color:var(--mute);font-style:normal;font-size:12px}
.lnk{border:0;background:none;color:var(--info);cursor:pointer;font-size:12.5px;padding:0}
.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}.mi:hover{background:var(--panel2)}
.seg{border-radius:10px}.seg button{padding:8px 12px}
.chips{margin-top:8px}.chip{background:var(--panel);font-size:12.5px;padding:3px 6px 3px 10px}
.fcount{font-size:12.5px}
/* today */
.att{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
.att button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer}
.att button b{display:block;font:700 20px Georgia,serif}.att button span{font-size:11.5px;color:var(--mute)}
.att button.on{border-color:var(--gold);background:var(--warnbg)}
.att button.bad b{color:var(--bad)}.att button.warn b{color:var(--warn)}
.more{display:inline-block;margin-top:8px;font-size:13px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.vc .split{display:none}.vc .ppl{font-size:13px;color:var(--mute)}.vc .ppl b{color:var(--ink);font-size:15px;font-family:Georgia,serif}

function raidOpen(id){ const x = id ? Object.assign({}, ((S.plan.raid || {}).items || {})[id]) : { type:'Risk', status:'Open' }, ed = canEdit(), dis = ed ? '' : ' disabled';

const wkKey = d => { const x = new Date((d || today()) + 'T12:00:00'); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0,10); };

 let rag = ''; const fill = () => { const c = W[$('#wkA').value.replace(/[.#$\/\[\]]/g, '_')] || {}; rag = c.rag || ''; $('#wkN').value = c.note || ''; $$('#wkRag button').forEach(b => b.classList.toggle('on', b.dataset.rag === rag)); };
 $('#wkA').onchange = fill; fill(); $$('#wkRag button').forEach(b => b.onclick = () => { rag = b.dataset.rag; $$('#wkRag button').forEach(x => x.classList.toggle('on', x === b)); });

}
{ const _home = RENDER.home; RENDER.home = (...a) => { const r = _home(...a); try { const v = $('#view'); if (v && !$('#wkCard')) { const d = document.createElement('div'); d.innerHTML = weeklyCard(); const kp = v.querySelector('.kpis'); if (kp && kp.nextSibling) v.insertBefore(d.firstChild, kp.nextSibling); else v.appendChild(d.firstChild); $('#wkUpd') && ($('#wkUpd').onclick = weeklyOpen); } } catch(e) { console.warn('[hub] weekly card', e); } return r; }; }
